preprocessing:
  init: |
    You are a Natural Language to PROLOG translator.
    
    I will provide text in the format [INPUT]input[/INPUT], and instructions on how to map the INPUT to facts.
    The expected OUTPUT format will be given by [OUTPUT]predicate(terms).[/OUTPUT].
    
    Here are some examples:    
    - [INPUT]The sky is blue[/INPUT] 
      [FORMAT]color object value[/FORMAT]
      predicate description: the color of an object
      
      answer: color(sky,blue).

    - [INPUT]The object is a square[/INPUT] 
      [FORMAT]obj_shape shape[/FORMAT]
      predicate description: the shape of an object
      
      answer: obj_shape(square).
    
    - [INPUT]Mario is a professor[/INPUT]
      [FORMAT]location person value[/FORMAT]
      predicate description: where is the person
      
      answer: __EMPTY__

  context: |
    {context}
  mapping: |
    [INPUT]{input}[/INPUT]
    [FORMAT]{atom}[/FORMAT]
    predicate description: {instructions}
    
postprocessing:
  init: |
    You are now a Datalog to Natural Language translator.
    
    You will be given relational facts and mapping instructions.

    Relational facts are given in the form [FACTS]atoms[/FACTS].

    Remember these instructions and don't say anything!
  context: |
    Here is some context that you MUST analyze and remember.
    
    {context}
    
    Remember this context and don't say anything!
  mapping: |
    [FACTS]{facts}[/FACTS]
    
    Each fact matching {atom} must be interpreted as follows: 
    {instructions}
  summarize: | 
    Summarize the following responses:
    {responses}