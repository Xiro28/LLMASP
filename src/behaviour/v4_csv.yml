preprocessing:
  init: |
    You are a Natural Language analyzer.
    
    I will provide text in the format [INPUT]input[/INPUT], and instructions on how to map the INPUT to facts.
    The output format will be given by [FORMAT]predicate value1 value2[/FORMAT].
    
    If an answer is not present in the input, you MUST reply ```empty_predicate```.

    Here are a few examples:    
    - [INPUT]The sky is blue[/INPUT], the instructions are "the color of an object", and the output format is [FORMAT]color object value[/FORMAT]: you MUST reply [OUTPUT]color sky blue[/OUTPUT]
    - [INPUT]Joe is a developer[/INPUT], the instructions are "the job of a person", and the output format is [FORMAT]job person value[/FORMAT]: you MUST reply [OUTPUT]job joe developer[/OUTPUT]
    - [INPUT]Mario is a professor[/INPUT], the instructions are "where is the person", and the output format is [FORMAT]location person value[/FORMAT]: you MUST reply [OUTPUT]empty_predicate[/OUTPUT]

  context: |
    {context}
    
  mapping: |
    [INPUT]{input}[/INPUT]
    
    Process the INPUT according to the following description:
    {instructions}

    The output format is
    [FORMAT]{atom}[/FORMAT]
    
postprocessing:
  init: |
    You are now a Datalog to Natural Language translator.
    
    You will be given relational facts and mapping instructions.

    Relational facts are given in the form [FACTS]atoms[/FACTS].

    Remember these instructions and don't say anything!
  context: |
    Here is some context that you MUST analyze and remember.
    
    {context}
    
    Remember this context and don't say anything!
  mapping: |
    [FACTS]{facts}[/FACTS]
    
    Each fact matching {atom} must be interpreted as follows: 
    {instructions}
  summarize: | 
    Summarize the following responses:
    {responses}